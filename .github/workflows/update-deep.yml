# วิเคราะห์ลึกอัตโนมัติทุก 3 วัน — ไม่ต้องเปิด MacBook
# ======================================================
# ทำงานบนเครื่องของ GitHub (ฟรีสำหรับ repo แบบ public)
#
# ทำไมต้องแยกจาก update-snapshot.yml
# -----------------------------------
# ไฟล์นั้นทำ "คัดกรองเร็ว" — 1.5 วินาทีต่อหุ้น จบใน 20 นาที ทำได้ทุกวัน
# ไฟล์นี้ทำ "วิเคราะห์ลึก" — 30 วินาทีต่อหุ้น ช้ากว่า 20 เท่า
# หุ้นสหรัฐ 10,398 ตัว = 87 ชั่วโมง ทำรอบเดียวไม่ได้แน่นอน
#
# จึงออกแบบเป็น "ทยอยทำ" — แต่ละรอบทำเท่าที่เวลาให้ แล้วรอบหน้าทำต่อ
# ตัวที่ทำแล้วจะไม่ถูกทำซ้ำ ยกเว้นผลเก่าเกิน 3 วัน
#
# ข้อจำกัดของ GitHub Actions ที่ต้องรู้
# --------------------------------------
#   1. งานเดียวรันได้ไม่เกิน 6 ชั่วโมง  -> ตั้งงบเวลา 5 ชม. เผื่อเวลา push
#   2. Yahoo อาจปิดกั้นเครื่องของ GitHub -> ถ้าโดน ให้กลับไปกดปุ่มบน MacBook
#      (ดูผลจริงได้ที่แท็บ Actions บน GitHub — ขั้นตอนจะแจ้งไว้ชัดเจน)
#
# ตารางเวลา : วันที่ 1, 4, 7, ... ของเดือน เวลา 17:30 น. เวลาไทย
# ไทยกับสหรัฐสลับกันคนละวัน จะได้ไม่แย่งเวลากันและได้อัปเดตทั้งคู่

name: วิเคราะห์ลึกอัตโนมัติทุก 3 วัน

on:
  schedule:
    # 10:30 UTC = 17:30 น. เวลาไทย (ตลาดไทยปิด 16:30 จึงได้ราคาปิดจริง)
    # หุ้นไทย  : วันที่ 1, 7, 13, 19, 25
    - cron: "30 10 1,7,13,19,25 * *"
    # หุ้นสหรัฐ : วันที่ 4, 10, 16, 22, 28
    - cron: "30 10 4,10,16,22,28 * *"
  workflow_dispatch:
    inputs:
      market:
        description: "ตลาดที่จะวิเคราะห์"
        required: true
        default: thai
        type: choice
        options: [thai, us]
      hours:
        description: "งบเวลา (ชั่วโมง) — สูงสุด 5"
        required: true
        default: "5"
        type: string
      refresh_days:
        description: "ผลเก่าเกินกี่วันให้ทำใหม่"
        required: true
        default: "3"
        type: string

permissions:
  contents: write

# ห้ามรันซ้อน — ถ้ารอบก่อนยังไม่จบ ให้รอ
# ถ้ารันซ้อนกันสองตัวจะเขียนไฟล์ผลทับกัน ข้อมูลจะหาย
concurrency:
  group: update-deep
  cancel-in-progress: false

jobs:
  deep:
    runs-on: ubuntu-latest
    timeout-minutes: 350          # 5 ชม. 50 นาที — ต่ำกว่าเพดาน 6 ชม. ของ GitHub

    steps:
      - name: ดึงโค้ดล่าสุด
        uses: actions/checkout@v4

      - name: ติดตั้ง Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: ติดตั้งไลบรารี
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy certifi requests

      - name: เลือกตลาดของรอบนี้
        id: pick
        run: |
          if [ -n "${{ github.event.inputs.market }}" ]; then
            MARKET="${{ github.event.inputs.market }}"
            HOURS="${{ github.event.inputs.hours }}"
            DAYS="${{ github.event.inputs.refresh_days }}"
          else
            # ตั้งเวลาไว้สองบรรทัด แยกด้วยวันที่
            # วันคี่ในชุด 1,7,13,19,25 = ไทย · ที่เหลือ = สหรัฐ
            DAY=$(date -u +%-d)
            case "$DAY" in
              1|7|13|19|25) MARKET=thai ;;
              *)            MARKET=us ;;
            esac
            HOURS=5
            DAYS=3
          fi
          echo "market=$MARKET" >> $GITHUB_OUTPUT
          echo "hours=$HOURS"   >> $GITHUB_OUTPUT
          echo "days=$DAYS"     >> $GITHUB_OUTPUT
          echo "รอบนี้ทำตลาด $MARKET · งบเวลา $HOURS ชม. · ผลเก่าเกิน $DAYS วันทำใหม่"

      - name: วิเคราะห์ลึก
        id: scan
        run: |
          python tools_deep_scan.py \
            --${{ steps.pick.outputs.market }} --all \
            --hours ${{ steps.pick.outputs.hours }} \
            --refresh-days ${{ steps.pick.outputs.days }} \
            2>&1 | tee scan.log
        continue-on-error: true

      - name: ตรวจว่ามีผลใหม่จริงไหม
        id: check
        run: |
          if [ -n "$(git status --porcelain data/snapshots)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            git status --short data/snapshots
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "ไม่มีผลใหม่ — อาจถูก Yahoo ปิดกั้น หรือครบแล้วและยังไม่ถึงรอบอัปเดต"
          fi

      - name: บันทึกกลับเข้า repo
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots
          git commit -m "วิเคราะห์ลึกอัตโนมัติ ${{ steps.pick.outputs.market }} $(TZ=Asia/Bangkok date '+%Y-%m-%d %H:%M น.')"
          # ระหว่างที่รัน 5 ชม. อาจมีการ push อย่างอื่นเข้ามา จึงต้องดึงมารวมก่อน
          git pull --rebase --autostash || true
          git push

      - name: สรุปผลลงหน้า Actions
        if: always()
        run: |
          M="${{ steps.pick.outputs.market }}"
          echo "## ผลวิเคราะห์ลึกอัตโนมัติ — ตลาด $M" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check.outputs.changed }}" = "true" ]; then
            echo "อัปเดตสำเร็จ — เปิดเว็บแล้วกด **โหลดข้อมูลใหม่** ได้เลย" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '### สิ่งที่เปลี่ยนจากรอบก่อน' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            sed -n '/สิ่งที่เปลี่ยนจากรอบก่อน/,/^-\{20,\}$/p' scan.log | head -40 >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "**ไม่ได้อัปเดต**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "สาเหตุที่พบบ่อยที่สุดคือ Yahoo ปิดกั้นเครื่องของ GitHub" >> $GITHUB_STEP_SUMMARY
            echo "ถ้าเป็นแบบนั้น ให้เปิดโปรแกรมบน MacBook แล้วกดปุ่ม **อัปเดตผลวิเคราะห์** แทน" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -25 scan.log >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
