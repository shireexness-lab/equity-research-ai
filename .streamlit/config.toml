# ตั้งค่าหน้าตาและพฤติกรรมของเว็บ
# ไฟล์นี้ปลอดภัยที่จะขึ้น GitHub (ไม่มีความลับ)
# ⚠️ ห้ามสับสนกับ .streamlit/secrets.toml ซึ่งมีความลับและถูกกันไว้ใน .gitignore แล้ว

[theme]
# ธีมมืดเป็นค่าเริ่มต้น
# ผู้ใช้สลับเป็นธีมสว่างเองได้ที่ปุ่ม ⋮ มุมขวาบน → Settings → Appearance
# (จงใจกำหนดแค่ 2 บรรทัด ไม่กำหนดสีพื้นหลังเอง เพื่อให้ปุ่มสลับธีมยังใช้งานได้)
base = "dark"
primaryColor = "#5b9bd5"

[server]
# ไม่ต้องรับไฟล์อัปโหลด จำกัดไว้เพื่อความปลอดภัยและประหยัดหน่วยความจำ
maxUploadSize = 2
enableXsrfProtection = true

[browser]
# ไม่ส่งสถิติการใช้งานออกไปข้างนอก
gatherUsageStats = false
